kind = "web"
previewPath = "/"
title = "Wedding Matter Pro"
version = "1.0.0"
id = "artifacts/wedding-matter-pro"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26004

[services.development]
run = "pnpm --filter @workspace/wedding-matter-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wedding-matter-pro", "run", "build" ]
publicDir = "artifacts/wedding-matter-pro/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26004"
BASE_PATH = "/"
